spring.application.name=expense-api

# Only accept connections from this computer, not other devices on the network.
server.address=127.0.0.1

# In-memory database: data resets every time the app restarts.
spring.datasource.url=jdbc:h2:mem:expenses
spring.h2.console.enabled=true

# Create the tables first, then load the sample rows in data.sql.
spring.jpa.defer-datasource-initialization=true
